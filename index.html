<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ravish House — Preview</title>
<style>
  :root { --ink:#2b2118; --paper:#f6efe3; --accent:#7a2e3a; --muted:#7c6f5e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
    font-family: Georgia, "Times New Roman", serif; line-height:1.5; }
  header { text-align:center; padding:3rem 1.25rem 1.5rem; }
  h1 { font-size:2.6rem; margin:0; letter-spacing:.5px; }
  .tag { color:var(--accent); font-style:italic; margin-top:.5rem; }
  .note { max-width:640px; margin:1rem auto 0; color:var(--muted); font-size:.9rem;
    background:#fff8ec; border:1px dashed #d8c6a8; padding:.75rem 1rem; border-radius:6px; }
  main { max-width:820px; margin:0 auto; padding:1rem 1.25rem 4rem; }
  .count { text-align:center; color:var(--muted); margin:.5rem 0 2rem; }
  ol { list-style:none; margin:0; padding:0; counter-reset:s; }
  li { padding:1rem 0; border-bottom:1px solid #e4d8c4; counter-increment:s; }
  li::before { content:counter(s) "."; color:var(--accent); font-weight:bold;
    margin-right:.6rem; }
  .series-title { font-size:1.25rem; font-weight:bold; }
  .theme { color:var(--accent); font-style:italic; }
  .meta { color:var(--muted); font-size:.92rem; margin-top:.15rem; }
  footer { text-align:center; color:var(--muted); font-size:.85rem; padding:2rem 1rem; }
</style>
</head>
<body>
  <header>
    <h1>Ravish House</h1>
    <div class="tag">Love, in the unlikeliest places.</div>
    <div class="note">
      <strong>Preview build.</strong> This minimal page lists the house and its series for review.
      Book covers and the full browsable bookstore come next, after sign-off.
    </div>
  </header>
  <main>
    <div class="count" id="count"></div>
    <ol id="series"></ol>
  </main>
  <footer>&copy; 1987–2026 Ravish House. All passions reserved.</footer>

<script>
// Minimal, self-contained summary for review (full details live in data.json).
const SERIES = [
  ["Love by the Numbers","Actuarial romance","Prudence Everdeath",4],
  ["Fathoms of the Heart","Submarine romance","Marina Deeps",3],
  ["The Rind & the Reckless","Competitive cheese-making romance","Colby Jack Sterling",5],
  ["Below Zero, Above Reason","Antarctic research-station romance","Dr. Ptarmigan Frost",3],
  ["Leave No Trace","Aggressively zero-waste romance","Fern Compostella",3],
  ["Nothing Matters","Nihilist romance","Søren Blank",4],
  ["Magma Rising","Volcanology romance","Ignatia Cinders",4],
  ["Bunker Down","Doomsday-prepper romance","Dakota Ridge",4],
  ["Between the Flags","Lifeguard romance, one body of water at a time","Sandy Shores",4],
  ["Not a Minute Late","Punctuality-fetish romance","Dot Sharpe",3],
  ["The Sweetest Sting","Beekeeping romance","Melissa Comb",3],
  ["Cooking the Books","Forensic accounting romance","Miles Ledger",3],
];
const ol = document.getElementById("series");
let total = 0;
for (const [title, theme, author, n] of SERIES) {
  total += n;
  const li = document.createElement("li");
  li.innerHTML = `<span class="series-title">${title}</span> — <span class="theme">${theme}</span>
    <div class="meta">by ${author} · ${n} book${n>1?"s":""}</div>`;
  ol.appendChild(li);
}
document.getElementById("count").textContent =
  `${SERIES.length} series · ${total} books`;
</script>
</body>
</html>
